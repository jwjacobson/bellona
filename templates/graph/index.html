{% extends "base.html" %}
{% block title %}Graph — Bellona{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
  <div>
    <h1 class="text-xl font-bold tracking-wide text-stone-100">Relationship Graph</h1>
    <p class="text-stone-400 text-sm mt-1">Entity relationships visualized. Up to 200 entities shown.</p>
  </div>
  <div id="graph-status" class="text-stone-400 text-sm"></div>
</div>

<div id="cy" class="border border-olive-900 bg-stone-800" style="height: 600px; width: 100%;"></div>

<div class="mt-3 flex gap-6 text-xs text-stone-500">
  <span>Drag to pan · Scroll to zoom · Hover for label · Click node to pin label and highlight connections</span>
  <span id="graph-counts"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.min.js"></script>
<script>
  const TYPE_COLORS = [
    '#15803d', '#0f766e', '#0e7490', '#1d4ed8', '#7c3aed',
    '#b45309', '#be185d', '#dc2626', '#65a30d', '#0369a1',
  ];

  async function loadGraph() {
    document.getElementById('graph-status').textContent = 'Loading…';
    let data;
    try {
      const res = await fetch('/ui/graph/data');
      data = await res.json();
    } catch (e) {
      document.getElementById('graph-status').textContent = 'Failed to load data.';
      return;
    }

    let layoutName = 'cose';
    if (typeof cytoscapeCoseBilkent !== 'undefined') {
      try {
        cytoscape.use(cytoscapeCoseBilkent);
        layoutName = 'cose-bilkent';
      } catch (e) {
        layoutName = 'cose';
      }
    }

    // Assign colors by entity type
    const typeIndex = {};
    let colorIdx = 0;
    for (const node of data.nodes) {
      const t = node.data.entity_type_id;
      if (!(t in typeIndex)) typeIndex[t] = TYPE_COLORS[colorIdx++ % TYPE_COLORS.length];
    }

    const elements = [
      ...data.nodes.map(n => ({
        group: 'nodes',
        data: n.data,
        style: { 'background-color': typeIndex[n.data.entity_type_id] || '#44403c' },
      })),
      ...data.edges.map(e => ({ group: 'edges', data: e.data })),
    ];

    const layoutOpts = layoutName === 'cose-bilkent'
      ? {
          name: 'cose-bilkent',
          animate: false,
          padding: 40,
          nodeRepulsion: 12000,
          idealEdgeLength: 120,
          edgeElasticity: 0.45,
          gravity: 0.25,
          numIter: 2500,
          tile: true,
          randomize: true,
        }
      : {
          name: 'cose',
          animate: false,
          padding: 40,
          nodeRepulsion: 12000,
          idealEdgeLength: 120,
        };

    const cy = cytoscape({
      container: document.getElementById('cy'),
      elements,
      style: [
        {
          selector: 'node',
          style: {
            'label': '',
            'color': '#f5f5f4',
            'font-size': '11px',
            'font-family': 'ui-monospace, monospace',
            'text-valign': 'bottom',
            'text-margin-y': '4px',
            'text-background-color': '#1c1917',
            'text-background-opacity': 0.85,
            'text-background-padding': '3px',
            'text-background-shape': 'roundrectangle',
            'width': '28px',
            'height': '28px',
            'border-width': '1px',
            'border-color': '#57534e',
          }
        },
        {
          selector: 'node.show-label',
          style: { 'label': 'data(display_label)' }
        },
        {
          selector: 'edge',
          style: {
            'width': 1,
            'line-color': '#57534e',
            'target-arrow-color': '#57534e',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier',
            'label': '',
            'font-size': '8px',
            'color': '#78716c',
            'font-family': 'ui-monospace, monospace',
          }
        },
        {
          selector: 'node:selected',
          style: {
            'border-color': '#2dd4bf',
            'border-width': '2px',
          }
        },
        {
          selector: '.faded',
          style: { 'opacity': 0.2 }
        },
      ],
      layout: layoutOpts,
      backgroundColor: '#292524',
      wheelSensitivity: 0.2,
    });

    // Label visibility: hover = transient, click = pinned.
    let pinned = null;

    cy.on('mouseover', 'node', function(evt) {
      const node = evt.target;
      if (node !== pinned) node.addClass('show-label');
    });
    cy.on('mouseout', 'node', function(evt) {
      const node = evt.target;
      if (node !== pinned) node.removeClass('show-label');
    });

    cy.on('tap', 'node', function(evt) {
      const node = evt.target;
      if (pinned && pinned !== node) pinned.removeClass('show-label');
      pinned = node;
      node.addClass('show-label');
      cy.elements().addClass('faded');
      node.removeClass('faded');
      node.connectedEdges().removeClass('faded');
      node.connectedEdges().connectedNodes().removeClass('faded');
    });
    cy.on('tap', function(evt) {
      if (evt.target === cy) {
        if (pinned) {
          pinned.removeClass('show-label');
          pinned = null;
        }
        cy.elements().removeClass('faded');
      }
    });

    const nodeCount = data.nodes.length;
    const edgeCount = data.edges.length;
    document.getElementById('graph-status').textContent = '';
    document.getElementById('graph-counts').textContent =
      `${nodeCount} node${nodeCount !== 1 ? 's' : ''} · ${edgeCount} edge${edgeCount !== 1 ? 's' : ''} · layout: ${layoutName}`;

    if (nodeCount === 0) {
      document.getElementById('graph-status').textContent = 'No entities to display yet.';
    }
  }

  loadGraph();
</script>
{% endblock %}
